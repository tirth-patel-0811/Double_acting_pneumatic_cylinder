<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
        }

        .video-container {
            width: 800px;
            max-width: 90%;
            background: #222;
            padding: 20px;
            border-radius: 12px;
        }

        video {
            width: 100%;
            display: block;
            border-radius: 8px;
            background: black;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #playPause {
            width: 90px;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #playPause:hover {
            background: #0056b3;
        }

        #seekBar {
            flex: 1;
            cursor: pointer;
        }

        #time {
            color: white;
            min-width: 100px;
            text-align: right;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="video-container">

    <video id="video">
        <source src="video.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

    <div class="controls">

        <button id="playPause">Play</button>

        <input
            type="range"
            id="seekBar"
            min="0"
            max="100"
            value="0"
            step="0.1"
        >

        <span id="time">00:00 / 00:00</span>

    </div>

</div>

<script>

    const video = document.getElementById("video");
    const playPause = document.getElementById("playPause");
    const seekBar = document.getElementById("seekBar");
    const timeDisplay = document.getElementById("time");


    // PLAY / PAUSE BUTTON
    playPause.addEventListener("click", function () {

        if (video.paused) {
            video.play();
            playPause.textContent = "Pause";
        } else {
            video.pause();
            playPause.textContent = "Play";
        }

    });


    // UPDATE SLIDER WHILE VIDEO IS PLAYING
    video.addEventListener("timeupdate", function () {

        if (video.duration) {

            const percentage =
                (video.currentTime / video.duration) * 100;

            seekBar.value = percentage;

            updateTime();

        }

    });


    // WHEN USER TOUCHES / CLICKS / DRAGS SLIDER
    seekBar.addEventListener("input", function () {

        // Automatically pause video
        video.pause();

        // Change video time according to slider
        if (video.duration) {

            const newTime =
                (seekBar.value / 100) * video.duration;

            video.currentTime = newTime;

            updateTime();

        }

        // Make button show Play
        playPause.textContent = "Play";

    });


    // VIDEO LOADED
    video.addEventListener("loadedmetadata", function () {

        updateTime();

    });


    // VIDEO ENDS
    video.addEventListener("ended", function () {

        playPause.textContent = "Play";

    });


    // FORMAT TIME
    function formatTime(seconds) {

        if (isNaN(seconds)) {
            return "00:00";
        }

        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);

        return (
            String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0")
        );

    }


    // UPDATE TIME DISPLAY
    function updateTime() {

        const current = formatTime(video.currentTime);
        const total = formatTime(video.duration);

        timeDisplay.textContent =
            current + " / " + total;

    }

</script>
</body>
</html>
