<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Double Acting Pneumatic Cylinder</title>

    <style>

        /* ================================
           COMPLETE TRANSPARENT BACKGROUND
           ================================ */

        html {
            margin: 0;
            padding: 0;
            background: transparent !important;
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent !important;
            font-family: Arial, sans-serif;
        }


        /* ================================
           VIDEO CONTAINER
           ================================ */

        .video-container {
            width: 800px;
            max-width: 95%;

            margin: 20px auto;
            padding: 0;

            background: transparent !important;

            border: none;
            box-shadow: none;
        }


        /* ================================
           VIDEO
           ================================ */

        video {
            width: 100%;
            height: auto;

            display: block;

            border-radius: 8px;

            background: transparent !important;

            border: none;
        }


        /* ================================
           CONTROLS
           ================================ */

        .controls {
            width: 100%;

            margin-top: 12px;
            padding: 0;

            display: flex;
            align-items: center;

            gap: 12px;

            background: transparent !important;

            border: none;
            box-shadow: none;
        }


        /* ================================
           PLAY / PAUSE BUTTON
           ================================ */

        #playPause {

            min-width: 80px;

            padding: 9px 16px;

            border: none;
            border-radius: 6px;

            background: #007bff;
            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        #playPause:hover {
            background: #0069d9;
        }


        /* ================================
           SLIDER
           ================================ */

        #seekBar {

            flex: 1;

            height: 5px;

            cursor: pointer;

            accent-color: #007bff;
        }


        /* ================================
           TIME
           ================================ */

        #time {

            min-width: 95px;

            color: #ffffff;

            font-size: 14px;

            text-align: right;

            white-space: nowrap;
        }


        /* ================================
           MOBILE
           ================================ */

        @media (max-width: 600px) {

            .video-container {
                width: 100%;
                max-width: 100%;

                margin: 10px auto;
            }

            .controls {
                gap: 8px;
            }

            #playPause {

                min-width: 70px;

                padding: 8px 12px;

                font-size: 13px;
            }

            #time {

                min-width: 75px;

                font-size: 12px;
            }

        }

    </style>

</head>


<body>


<div class="video-container">


    <!-- VIDEO -->

    <video id="video" preload="metadata">

        <source src="video.mp4" type="video/mp4">

        Your browser does not support HTML5 video.

    </video>


    <!-- CONTROLS -->

    <div class="controls">

        <button id="playPause">
            Play
        </button>


        <input
            type="range"
            id="seekBar"
            min="0"
            max="100"
            value="0"
            step="0.1"
        >


        <span id="time">
            00:00 / 00:00
        </span>

    </div>


</div>


<script>

    const video = document.getElementById("video");

    const playPause = document.getElementById("playPause");

    const seekBar = document.getElementById("seekBar");

    const timeDisplay = document.getElementById("time");


    /* ================================
       PLAY / PAUSE
       ================================ */

    playPause.addEventListener("click", function () {

        if (video.paused) {

            video.play();

            playPause.textContent = "Pause";

        } else {

            video.pause();

            playPause.textContent = "Play";

        }

    });


    /* ================================
       VIDEO TIME UPDATE
       ================================ */

    video.addEventListener("timeupdate", function () {

        if (video.duration) {

            const percentage =
                (video.currentTime / video.duration) * 100;

            seekBar.value = percentage;

            updateTime();

        }

    });


    /* ================================
       SLIDER

       Touch / click / drag slider
       automatically pauses video
       ================================ */

    seekBar.addEventListener("input", function () {

        video.pause();

        if (video.duration) {

            const newTime =
                (seekBar.value / 100) * video.duration;

            video.currentTime = newTime;

            updateTime();

        }

        playPause.textContent = "Play";

    });


    /* ================================
       VIDEO LOADED
       ================================ */

    video.addEventListener("loadedmetadata", function () {

        updateTime();

    });


    /* ================================
       VIDEO ENDED
       ================================ */

    video.addEventListener("ended", function () {

        playPause.textContent = "Play";

        seekBar.value = 100;

        updateTime();

    });


    /* ================================
       FORMAT TIME
       ================================ */

    function formatTime(seconds) {

        if (isNaN(seconds)) {
            return "00:00";
        }

        const minutes =
            Math.floor(seconds / 60);

        const secs =
            Math.floor(seconds % 60);

        return (
            String(minutes).padStart(2, "0")
            + ":" +
            String(secs).padStart(2, "0")
        );

    }


    /* ================================
       UPDATE TIME
       ================================ */

    function updateTime() {

        const current =
            formatTime(video.currentTime);

        const total =
            formatTime(video.duration);

        timeDisplay.textContent =
            current + " / " + total;

    }

</script>


</body>

</html>
